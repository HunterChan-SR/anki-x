[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "anki-x-cli"
dynamic = ["version"]
description = "A ready-to-use terminal companion for Anki Desktop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "anki-x contributors"}]
dependencies = [
  "textual>=8.2.8,<9",
  "platformdirs>=4.13,<5",
  "portalocker>=4.4,<5",
  "miniaudio>=1.71,<2",
  "packaging>=25,<27",
  "zstandard>=0.24,<1",
  "psutil>=7,<8",
]

[project.scripts]
anki-x = "anki_x.__main__:main"

[project.urls]
Repository = "https://github.com/HunterChan-SR/anki-x"
Issues = "https://github.com/HunterChan-SR/anki-x/issues"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "pyinstaller>=6.22,<7", "build>=1.3,<2"]

[tool.hatch.version]
path = "anki_x/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["anki_x"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/anki_x", "/tests", "/tools", "/packaging", "/docs", "/.github",
  "/pyproject.toml", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md",
  "/requirements*.lock", "/uv.lock", "/install.sh", "/install.ps1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

