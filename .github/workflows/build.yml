name: Build and verify anki-x
on:
  push:
    branches: [master, codex/productization]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock -r requirements-build.lock
          python -m pip install --no-deps .
          python -m pip install anki==26.9.3 aqt==26.9.3
      - name: Linux Anki runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libnss3 libasound2
      - name: Test application and native platform services
        env:
          ANKI_X_AUDIO_BACKEND: "null"
        run: python -m pytest -q
      - name: Build release
        run: python tools/build_release.py
      - name: Verify real Anki scheduler in an isolated collection
        run: python tools/smoke_pinned_scheduler.py
      - name: Verify first-run plugin, sample cards, audio and native review
        run: python tools/smoke_onboarding.py
      - name: Verify frozen program without source imports
        run: python tools/smoke_distribution.py
      - name: Native install entry points
        run: python tools/package_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: anki-x-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.dmg
            dist/*-setup.exe
            dist/*-verification.json
          retention-days: 30
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum *.zip *.dmg *-setup.exe > SHA256SUMS
          cp ../install.sh ../install.ps1 .
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --draft --prerelease --title "anki-x ${{ github.ref_name }}" --notes-file docs/RELEASE_NOTES.md
