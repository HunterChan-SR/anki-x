name: Build and verify anki-x
on:
  push:
    branches: [master, codex/productization]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install . pytest pytest-asyncio pyinstaller build anki==26.9.3
      - name: Test application and native platform services
        env:
          ANKI_X_AUDIO_BACKEND: "null"
        run: python -m pytest -q
      - name: Build release
        run: python tools/build_release.py
      - name: Verify real Anki scheduler in an isolated collection
        run: python tools/smoke_pinned_scheduler.py
      - name: Verify frozen program without source imports
        run: python tools/smoke_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: anki-x-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*-verification.json
          retention-days: 30
