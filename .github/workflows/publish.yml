name: Publish package channels
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag to retry (e.g. v1.0.0rc2)"
        required: true
        type: string
      channel:
        description: "Channel to publish/retry"
        type: choice
        options: [all, pypi, npm, homebrew]
        default: all
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and validate immutable release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?', tag):
              raise SystemExit('Expected vX.Y.Z or vX.Y.ZrcN')
          sha = subprocess.check_output(['git','rev-parse',f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          subprocess.run(['git','checkout','--detach',sha], check=True)
          from anki_x import __version__
          if tag != 'v' + __version__:
              raise SystemExit('Tag and application version do not match')
          pre = bool(re.search(r'(a|b|rc)\d+$', __version__))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\nsha={sha}\nprerelease={str(pre).lower()}\nnpm_tag={"next" if pre else "latest"}\n')
          PY
  build:
    needs: resolve
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ needs.resolve.outputs.sha }}
  prepare:
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          pattern: anki-x-*
          path: release-assets
          merge-multiple: true
      - name: Reuse published archives on retry
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir release-assets --pattern '*.zip' --pattern 'SHA256SUMS'
          cd release-assets
          sha256sum --check --ignore-missing SHA256SUMS
      - name: Build Python distributions and channel metadata
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$RELEASE_SHA")
          python -m pip install 'build>=1.3,<2' 'twine>=6,<7'
          python -m build --outdir channels/python
          python -m twine check --strict channels/python/*
          python tools/verify_wheel.py channels/python
          python tools/prepare_channels.py --assets release-assets --output channels
          cd channels/npm
          npm ci --ignore-scripts
          npm pack --ignore-scripts
      - name: Publish verified GitHub assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          IS_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          cd release-assets
          sha256sum *.zip *.dmg *-setup.exe > SHA256SUMS
          cp ../install.sh ../install.ps1 .
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published native archives.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./* --verify-tag --prerelease="$IS_PRERELEASE" --title "anki-x $RELEASE_TAG" --notes-file ../docs/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: package-channels
          path: channels/
          retention-days: 30
  pypi:
    needs: [resolve, prepare]
    if: always() && needs.prepare.result == 'success' && (inputs.channel == '' || inputs.channel == 'all' || inputs.channel == 'pypi')
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/anki-x
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package-channels
          path: channels
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: channels/python/
          skip-existing: true
  npm:
    needs: [resolve, prepare]
    if: always() && needs.prepare.result == 'success' && (inputs.channel == '' || inputs.channel == 'all' || inputs.channel == 'npm')
    runs-on: ubuntu-22.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/anki-x
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: package-channels
          path: channels
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish to npm using trusted publishing
        env:
          NPM_DIST_TAG: ${{ needs.resolve.outputs.npm_tag }}
        run: python tools/publish_npm.py channels/npm
  homebrew:
    needs: [resolve, prepare]
    if: always() && needs.prepare.result == 'success' && (inputs.channel == '' || inputs.channel == 'all' || inputs.channel == 'homebrew')
    runs-on: ubuntu-22.04
    # Stable releases and prereleases share a formula. Serialize tap updates.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: HunterChan-SR/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/download-artifact@v4
        with:
          name: package-channels
          path: channels
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Homebrew formula
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python -m pip install 'packaging>=25,<27'
          python - <<'PY'
          import pathlib, re, shutil
          from packaging.version import Version
          target = pathlib.Path('tap/Formula/anki-x.rb')
          source = pathlib.Path('channels/homebrew/Formula/anki-x.rb')
          get_version = lambda p: Version(re.search(r'  version "([^"]+)"', p.read_text())[1])
          if target.exists() and get_version(target) > get_version(source):
              print('A newer release is already in the tap; preserving it.')
          else:
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/anki-x.rb
          if ! git diff --cached --quiet; then
            git commit -m "anki-x $RELEASE_TAG"
            git push
          fi
